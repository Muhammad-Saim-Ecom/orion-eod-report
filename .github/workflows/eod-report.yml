name: EOD Report

# ─────────────────────────────────────────────────────────────────────────
# WHEN THIS RUNS — edit the time here.
#
# Cron format is:  "MINUTE HOUR * * 1-5"   (times are in UTC, Mon–Fri).
# Eastern Time is UTC minus 4 (summer/EDT) or minus 5 (winter/EST).
#   • 5:00 PM EDT  = 21:00 UTC  → "0 21 * * 1-5"
#   • 5:00 PM EST  = 22:00 UTC  → "0 22 * * 1-5"
# Also set the GitHub Variable REPORT_POST_HOUR to the local hour you expect
# (e.g. 17 for 5 PM). The app only posts when the local hour matches it.
#
# >>> TEST MODE (2026-06-29): firing at 22:07 UTC = 6:07 PM ET. <<<
#     Set REPORT_POST_HOUR variable to 18 for this test, then change back to 17.
# ─────────────────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: "7 22 * * 1-5" # TEST: 6:07 PM EDT
  workflow_dispatch: # lets you run it manually from the Actions tab
    inputs:
      force:
        description: "Run even if not a weekday / scheduled hour (true/false)"
        required: false
        default: "false"

concurrency:
  group: eod-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Post EOD report
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_MASTER_TRACKER_DB_ID: ${{ secrets.NOTION_MASTER_TRACKER_DB_ID }}
          # Preferred: long-lived token (no account password stored).
          TD_TOKEN: ${{ secrets.TD_TOKEN }}
          TD_COMPANY_ID: ${{ secrets.TD_COMPANY_ID }}
          REPORT_TIMEZONE: ${{ vars.REPORT_TIMEZONE || 'America/New_York' }}
          REPORT_ACCOUNTS: ${{ vars.REPORT_ACCOUNTS }}
          TRACKED_FALLBACK_DAYS: ${{ vars.TRACKED_FALLBACK_DAYS || '90' }}
          REPORT_POST_HOUR: ${{ vars.REPORT_POST_HOUR || '17' }}
          REPORT_FYI_USER_IDS: ${{ vars.REPORT_FYI_USER_IDS }}
          REPORT_CYCLE_START_DAYS: ${{ vars.REPORT_CYCLE_START_DAYS }}
          SKIP_US_HOLIDAYS: ${{ vars.SKIP_US_HOLIDAYS || 'false' }}
          ALERT_SLACK_USER_ID: ${{ secrets.ALERT_SLACK_USER_ID }}
          LOG_LEVEL: info
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            npx tsx src/index.ts report --force
          else
            npx tsx src/index.ts report
          fi

name: EOD Report

# Posts the End-of-Day report at 5:00 PM America/New_York, Monday–Friday.
#
# GitHub cron is UTC and has no timezone/DST awareness, so we trigger at BOTH
# 21:00 UTC (= 5 PM EDT, ~Mar–Nov) and 22:00 UTC (= 5 PM EST, ~Nov–Mar). The
# app's own DST guard (localHour === 17) ensures only the correct one posts;
# the other run is a no-op. Mon–Fri is enforced both here and in code.
on:
  schedule:
    - cron: "0 21 * * 1-5" # 5 PM EDT
    - cron: "0 22 * * 1-5" # 5 PM EST
  workflow_dispatch: # allow manual runs from the Actions tab
    inputs:
      force:
        description: "Run even if not a weekday / 5 PM (true/false)"
        required: false
        default: "false"

concurrency:
  group: eod-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Post EOD report
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_MASTER_TRACKER_DB_ID: ${{ secrets.NOTION_MASTER_TRACKER_DB_ID }}
          # Preferred: long-lived token (no account password stored).
          TD_TOKEN: ${{ secrets.TD_TOKEN }}
          TD_COMPANY_ID: ${{ secrets.TD_COMPANY_ID }}
          REPORT_TIMEZONE: ${{ vars.REPORT_TIMEZONE || 'America/New_York' }}
          REPORT_ACCOUNTS: ${{ vars.REPORT_ACCOUNTS }}
          TRACKED_FALLBACK_DAYS: ${{ vars.TRACKED_FALLBACK_DAYS || '90' }}
          REPORT_FYI_USER_IDS: ${{ vars.REPORT_FYI_USER_IDS }}
          REPORT_CYCLE_START_DAYS: ${{ vars.REPORT_CYCLE_START_DAYS }}
          SKIP_US_HOLIDAYS: ${{ vars.SKIP_US_HOLIDAYS || 'false' }}
          ALERT_SLACK_USER_ID: ${{ secrets.ALERT_SLACK_USER_ID }}
          LOG_LEVEL: info
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            npx tsx src/index.ts report --force
          else
            npx tsx src/index.ts report
          fi
